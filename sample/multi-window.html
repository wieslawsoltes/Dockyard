<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dockyard — Multi-window workspace</title>
<link rel="stylesheet" href="../src/avalondock.css">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:13px system-ui;background:#151a22;color:#e1e7ef;display:flex;flex-direction:column}
header{padding:18px 22px 14px;border-bottom:1px solid #303744;display:flex;align-items:center;gap:20px}header strong{font-size:19px;letter-spacing:-.5px}header span{color:#91a0b2}a{color:#96cfff}header a{margin-left:auto;text-decoration:none}
nav{padding:12px 22px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #303744}button,select{background:#252d39;border:1px solid #414c5d;color:inherit;border-radius:5px;padding:7px 11px;font:inherit;cursor:pointer}button:hover{background:#344252}button.primary{background:#186492;border-color:#2588bf}label{display:flex;align-items:center;gap:7px;color:#a9b8ca}label:first-child{margin-right:12px}main{flex:1;min-height:0}footer{padding:9px 22px;border-top:1px solid #303744;color:#a9b8ca;display:flex;justify-content:space-between;gap:15px}footer small{max-width:65%}.editor{height:100%;padding:22px;display:flex;flex-direction:column;gap:10px}.editor h2{margin:0;font-size:20px}.editor p{color:#9cabbd;line-height:1.6}.editor textarea{flex:1;min-height:70px;resize:none;background:#161c26;border:1px solid #344152;color:#dce8f6;padding:14px;font:14px/1.6 ui-monospace,monospace}.tool-content{padding:18px;color:#afbed1}.tool-content button{display:block;margin-top:12px}#events{white-space:pre-wrap;margin:0;line-height:1.6}button:disabled{opacity:.5;cursor:default}
@media(max-width:700px){header span{display:none}header,nav{padding:12px}footer small{display:none}}
</style></head><body>
<header><strong>Dockyard /</strong><span>ONE LAYOUT. MANY WINDOWS.</span><a href="../">Full playground ↗</a></header>
<nav aria-label="Floating window options"><label>Default host <select id="mode" aria-label="Default floating host"><option value="InPage">In-page</option><option value="BrowserWindow">Browser window</option></select></label>
<button id="native" class="primary">Open editor in browser</button><button id="group">Open tools as a group</button><button id="inpage">Float editor in-page</button><button id="dockback">Dock all</button>
<label>On native close <select id="close" aria-label="Browser close behavior"><option>Dock</option><option>InPage</option><option>Close</option></select></label>
<button id="save">Save layout</button><button id="load">Load layout</button><button id="resume">Resume saved windows</button><label>Theme <select id="theme" aria-label="Theme"><option value="dark">Dark</option><option value="light">Light</option></select></label>
</nav><main id="workspace"></main><footer><span id="status">Ready</span><small>Drag tabs between browser windows. Closing a browser frame follows the policy above; the in-app close button honors cancellation.</small></footer>
<script type="module" src="multi-window.js"></script></body></html>
