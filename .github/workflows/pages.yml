name: Verify and publish Dockyard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockyard-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test tools
        run: |
          npm install --no-save --package-lock=false --ignore-scripts typescript@5.8.3
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import os
          with sync_playwright() as p:
              with open(os.environ['GITHUB_ENV'], 'a') as env:
                  env.write('CHROMIUM_EXECUTABLE=' + p.chromium.executable_path + '\n')
          PY
      - name: Build, core tests and TypeScript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          npm run build | tee test-results/build.txt
          npm test | tee test-results/core.tap
          npm run check | tee test-results/typecheck.txt
          npm run api | tee test-results/api-inventory.txt
      - name: Chromium interaction tests
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser | tee test-results/browser.log
      - name: HTTP entry points, origin persistence and screenshots
        run: python scripts/verify-site.py
      - name: Package installation smoke test
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_DIR=$(mktemp -d)
          PACKAGE_NAME=$(npm pack --pack-destination "$PACKAGE_DIR" --silent)
          SMOKE_DIR=$(mktemp -d)
          cd "$SMOKE_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$PACKAGE_DIR/$PACKAGE_NAME"
          node --input-type=module -e 'import {DockingManager} from "avalondock-web"; const m = new DockingManager(); m.AddDocument({ContentId:"smoke", Title:"Package import"}); if(!m.Find("smoke")) throw new Error("Import failed"); m.Dispose(); console.log("PASS installed ESM package: create, lookup, dispose");' | tee "$GITHUB_WORKSPACE/test-results/package-smoke.txt"
      - name: Record environment and checksums
        run: |
          python - <<'PY'
          import hashlib, importlib.metadata, json, os, platform, subprocess
          from pathlib import Path
          def command(*args): return subprocess.check_output(args, text=True).strip()
          report = {
              'sourceCommit': os.environ['GITHUB_SHA'],
              'runUrl': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'node': command('node', '--version'),
              'typescript': command('node_modules/.bin/tsc', '--version'),
              'python': platform.python_version(),
              'playwright': importlib.metadata.version('playwright'),
              'chromium': json.loads(Path('test-results/browser-results.json').read_text())['browser'],
              'httpBrowserSmoke': 'All three entry points; real origin storage and reload; see site-results.json'
          }
          Path('test-results/environment.json').write_text(json.dumps(report, indent=2) + '\n')
          paths = set(command('git', 'ls-files', '--cached', '--others', '--exclude-standard').splitlines())
          rows = []
          for name in sorted(paths):
              path = Path(name)
              if name != 'SHA256SUMS' and path.is_file():
                  rows.append(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + name)
          Path('SHA256SUMS').write_text('\n'.join(rows) + '\n')
          PY
      - name: Commit verified distribution
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist standalone.html docs/API-SURFACE.json docs/images test-results SHA256SUMS
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh verified distribution and evidence [skip ci]'
            git push origin HEAD:main
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Stage public site and downloads
        run: node scripts/stage-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dockyard-verification
          path: test-results
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published commit and asset URLs
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          node --input-type=module <<'JS'
          const base = process.env.SITE_URL;
          const response = await fetch(new URL('deployment.json', base), {cache:'no-store'});
          if (!response.ok) throw new Error('Deployment metadata HTTP ' + response.status);
          const info = await response.json();
          if (info.commit !== process.env.EXPECTED_COMMIT) throw new Error('Published commit does not match the verified build');
          for (const name of ['', 'sample/minimal.html', 'standalone.html', 'src/index.js', 'dist/avalondock.js', 'dist/avalondock.css', 'downloads/avalondock-web-0.1.0.tgz', 'downloads/dockyard-source.zip']) {
            const result = await fetch(new URL(name, base));
            if (!result.ok) throw new Error(name + ': HTTP ' + result.status);
            console.log('PASS published asset', new URL(name, base).href);
            await result.arrayBuffer();
          }
          JS
